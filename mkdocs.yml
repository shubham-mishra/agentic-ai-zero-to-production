site_name: "Production Agentic AI: From Zero to Deployment"
site_description: "An open-source, production-grade course on building enterprise agentic systems."
site_author: "Enterprise AI Systems Engineering"

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - "Phase 1: Foundations":
    - "00. Architecture Foundations & Reproducible Environments": phase-1/00-environment-and-mocks.md
    - "01. Deterministic Control Flow & Reasoning Loops": phase-1/01-deterministic-control-flow.md
    - "02. Tool Sandboxing, FastMCP, and Schema Governance": phase-1/02-mcp-tools-and-sandboxing.md
