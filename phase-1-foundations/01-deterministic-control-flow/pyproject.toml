[project]
name = "module-01-deterministic-control-flow"
version = "0.1.0"
description = "Phase 1 - Module 1: Deterministic Control Flow and Core Reasoning Loops"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "openai>=1.50.0",
    "tiktoken>=0.8.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
