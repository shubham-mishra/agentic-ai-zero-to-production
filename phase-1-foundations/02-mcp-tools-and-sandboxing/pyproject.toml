[project]
name = "module-02-mcp-tools-and-sandboxing"
version = "0.1.0"
description = "Phase 1 - Module 2: Tool Sandboxing, FastMCP, and Schema Governance"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "openai>=1.50.0",
    "mcp>=1.0.0",
    "fastmcp>=0.1.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "docker>=7.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
